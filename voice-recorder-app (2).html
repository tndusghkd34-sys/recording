<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>음성 녹음 & 텍스트 변환기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
    background: #f5f5f5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #1a1a1a;
  }
  .container {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 16px;
    padding: 40px;
    max-width: 640px;
    width: 100%;
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
  }
  h1 {
    text-align: center;
    color: #1a1a1a;
    margin-bottom: 8px;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .subtitle {
    text-align: center;
    color: #888;
    margin-bottom: 32px;
    font-size: 14px;
  }
  .recorder-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    margin-bottom: 32px;
  }
  .record-btn {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: none;
    background: #1a1a1a;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1.4;
  }
  .record-btn:hover:not(:disabled) { transform: scale(1.05); background: #333; }
  .record-btn:active:not(:disabled) { transform: scale(0.95); }
  .record-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .record-btn.recording {
    background: #404040;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 6px 20px rgba(0,0,0,0.2); }
    50% { box-shadow: 0 6px 30px rgba(0,0,0,0.4); }
  }
  .timer {
    font-size: 32px;
    font-weight: 700;
    color: #1a1a1a;
    font-variant-numeric: tabular-nums;
    letter-spacing: -1px;
  }
  .status {
    color: #888;
    font-size: 13px;
    min-height: 20px;
  }
  .status.error { color: #1a1a1a; font-weight: 600; }
  .status.active { color: #1a1a1a; font-weight: 600; }
  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 24px;
  }
  .btn {
    padding: 12px 22px;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    background: #fff;
    color: #1a1a1a;
  }
  .btn:hover:not(:disabled) { background: #f5f5f5; border-color: #1a1a1a; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .btn-primary:hover:not(:disabled) { background: #333; }
  .btn-success { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .btn-success:hover:not(:disabled) { background: #333; }
  .transcript-box {
    background: #fafafa;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    padding: 16px;
    min-height: 150px;
    max-height: 300px;
    overflow-y: auto;
    font-size: 15px;
    line-height: 1.7;
    color: #1a1a1a;
    margin-bottom: 16px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .transcript-box.empty {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #b0b0b0;
    font-style: italic;
  }
  .interim { color: #b0b0b0; }
  .audio-player {
    width: 100%;
    margin-bottom: 16px;
    border-radius: 10px;
    filter: grayscale(100%);
  }
  .audio-player:not([src]) { display: none; }
  .label {
    font-size: 12px;
    font-weight: 600;
    color: #888;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .section { margin-bottom: 20px; }
  .info {
    background: #fafafa;
    border-left: 3px solid #1a1a1a;
    padding: 12px 16px;
    border-radius: 6px;
    font-size: 13px;
    color: #555;
    margin-top: 16px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🎙️ 음성 녹음 & 텍스트 변환</h1>
  <p class="subtitle">버튼을 눌러 바로 녹음하고 텍스트로 변환하세요</p>

  <div class="recorder-section">
    <button id="recordBtn" class="record-btn">🎤<br>녹음 시작</button>
    <div class="timer" id="timer">00:00</div>
    <div class="status" id="status">준비됨</div>
  </div>

  <div class="section">
    <div class="label">📝 실시간 텍스트 변환</div>
    <div id="transcript" class="transcript-box empty">녹음을 시작하면 여기에 텍스트가 표시됩니다</div>
  </div>

  <div class="section">
    <div class="label">🔊 녹음된 오디오</div>
    <audio id="audioPlayer" class="audio-player" controls></audio>
  </div>

  <div class="controls">
    <button id="downloadAudioBtn" class="btn btn-primary" disabled>🎵 오디오 다운로드</button>
    <button id="downloadTextBtn" class="btn btn-success" disabled>📄 텍스트(.txt) 다운로드</button>
    <button id="clearBtn" class="btn">🗑️ 초기화</button>
  </div>

  <div class="info">
    💡 <strong>안내</strong>: 음성 인식은 Chrome, Edge 브라우저에서 가장 잘 작동합니다. 마이크 권한 허용이 필요해요.
  </div>
</div>

<script>
  const recordBtn = document.getElementById('recordBtn');
  const timerEl = document.getElementById('timer');
  const statusEl = document.getElementById('status');
  const transcriptEl = document.getElementById('transcript');
  const audioPlayer = document.getElementById('audioPlayer');
  const downloadAudioBtn = document.getElementById('downloadAudioBtn');
  const downloadTextBtn = document.getElementById('downloadTextBtn');
  const clearBtn = document.getElementById('clearBtn');

  let mediaRecorder = null;
  let audioChunks = [];
  let audioBlob = null;
  let audioUrl = null;
  let isRecording = false;
  let startTime = 0;
  let timerInterval = null;

  let recognition = null;
  let finalTranscript = '';
  let interimTranscript = '';

  // Web Speech API 설정
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'ko-KR';
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = (event) => {
      interimTranscript = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          finalTranscript += transcript + ' ';
        } else {
          interimTranscript += transcript;
        }
      }
      updateTranscript();
    };

    recognition.onerror = (event) => {
      console.error('음성 인식 오류:', event.error);
      if (event.error === 'no-speech') return;
      if (event.error === 'not-allowed') {
        setStatus('마이크 권한이 거부되었습니다', 'error');
      }
    };

    recognition.onend = () => {
      // 녹음 중이면 자동 재시작 (장시간 녹음 지원)
      if (isRecording) {
        try { recognition.start(); } catch(e) {}
      }
    };
  } else {
    transcriptEl.textContent = '⚠️ 이 브라우저는 음성 인식을 지원하지 않습니다. Chrome 또는 Edge를 사용해주세요.';
    transcriptEl.classList.remove('empty');
  }

  function updateTranscript() {
    if (!finalTranscript && !interimTranscript) {
      transcriptEl.classList.add('empty');
      transcriptEl.textContent = '녹음을 시작하면 여기에 텍스트가 표시됩니다';
      downloadTextBtn.disabled = true;
      return;
    }
    transcriptEl.classList.remove('empty');
    transcriptEl.innerHTML = finalTranscript +
      '<span class="interim">' + interimTranscript + '</span>';
    transcriptEl.scrollTop = transcriptEl.scrollHeight;
    downloadTextBtn.disabled = !finalTranscript.trim();
  }

  function setStatus(text, type = '') {
    statusEl.textContent = text;
    statusEl.className = 'status ' + type;
  }

  function formatTime(ms) {
    const totalSec = Math.floor(ms / 1000);
    const min = String(Math.floor(totalSec / 60)).padStart(2, '0');
    const sec = String(totalSec % 60).padStart(2, '0');
    return `${min}:${sec}`;
  }

  function startTimer() {
    startTime = Date.now();
    timerInterval = setInterval(() => {
      timerEl.textContent = formatTime(Date.now() - startTime);
    }, 200);
  }

  function stopTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
  }

  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      
      // MediaRecorder 호환성 처리
      let options = {};
      if (MediaRecorder.isTypeSupported('audio/webm')) {
        options.mimeType = 'audio/webm';
      } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
        options.mimeType = 'audio/mp4';
      }
      
      mediaRecorder = new MediaRecorder(stream, options);
      audioChunks = [];

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const mimeType = mediaRecorder.mimeType || 'audio/webm';
        audioBlob = new Blob(audioChunks, { type: mimeType });
        if (audioUrl) URL.revokeObjectURL(audioUrl);
        audioUrl = URL.createObjectURL(audioBlob);
        audioPlayer.src = audioUrl;
        downloadAudioBtn.disabled = false;
        // 스트림 정리
        stream.getTracks().forEach(track => track.stop());
      };

      mediaRecorder.start();
      isRecording = true;

      // 음성 인식 시작
      if (recognition) {
        finalTranscript = '';
        interimTranscript = '';
        updateTranscript();
        try { recognition.start(); } catch(e) {}
      }

      recordBtn.classList.add('recording');
      recordBtn.innerHTML = '⏹️<br>중지';
      setStatus('🔴 녹음 중...', 'active');
      startTimer();
    } catch (err) {
      console.error(err);
      setStatus('마이크 접근 실패: ' + err.message, 'error');
    }
  }

  function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
    isRecording = false;

    if (recognition) {
      try { recognition.stop(); } catch(e) {}
    }

    recordBtn.classList.remove('recording');
    recordBtn.innerHTML = '🎤<br>녹음 시작';
    setStatus('녹음 완료 ✅', '');
    stopTimer();
  }

  recordBtn.addEventListener('click', () => {
    if (isRecording) stopRecording();
    else startRecording();
  });

  downloadAudioBtn.addEventListener('click', () => {
    if (!audioBlob) return;
    const ext = audioBlob.type.includes('mp4') ? 'mp4' : 'webm';
    const a = document.createElement('a');
    a.href = audioUrl;
    a.download = `recording_${new Date().toISOString().replace(/[:.]/g, '-')}.${ext}`;
    a.click();
  });

  downloadTextBtn.addEventListener('click', () => {
    const text = finalTranscript.trim();
    if (!text) return;
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `transcript_${new Date().toISOString().replace(/[:.]/g, '-')}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  });

  clearBtn.addEventListener('click', () => {
    if (isRecording) stopRecording();
    finalTranscript = '';
    interimTranscript = '';
    audioBlob = null;
    if (audioUrl) URL.revokeObjectURL(audioUrl);
    audioUrl = null;
    audioPlayer.removeAttribute('src');
    audioPlayer.load();
    downloadAudioBtn.disabled = true;
    downloadTextBtn.disabled = true;
    timerEl.textContent = '00:00';
    setStatus('준비됨', '');
    updateTranscript();
  });
</script>
</body>
</html>
